name: Build rndsnd

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Scarica il modello ONNX
      run: |
        mkdir model
        curl -L -o model/Cnn14.onnx "INSERISCI_QUI_URL_AL_TUO_MODELLO_ONNX"
        curl -L -o model/class_labels_indices.csv "http://storage.googleapis.com/us_audioset/youtube_corpus/v1/csv/class_labels_indices.csv"

    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyside6 librosa soundfile pydub numpy matplotlib onnxruntime

    - name: Avvia la compilazione
      run: python build_rndsnd.py

    - name: Salva il pacchetto eseguibile
      uses: actions/upload-artifact@v4
      with:
        name: rndsnd-v0.11.0-${{ matrix.os }}
        path: dist/
