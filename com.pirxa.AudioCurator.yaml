id: com.pirxa.AudioCurator
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: start-audio-curator
finish-args:
  - --share=ipc
  - --socket=x11              # Permette la grafica
  - --socket=pulseaudio       # Permette l'audio (fondamentale per evitare underrun)
  - --device=all              # Accesso alla scheda audio
  - --filesystem=home         # Permette di leggere i file audio e salvare gli export
  - --share=network           # Necessario solo per installare i pacchetti con pip durante la build

modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      # Installiamo le librerie Python dentro la sandbox
      - pip3 install --prefix=/app numpy librosa sounddevice pydub PySide6 matplotlib
    sources:
      - type: shell
        commands:
          - ""

  - name: audio-curator-app
    buildsystem: simple
    build-commands:
      # Copiamo lo script e il DB nella cartella binaria della sandbox
      - install -D app_desktop.py /app/bin/app_desktop.py
      - install -D audio.db /app/bin/audio.db
      # Creiamo lo script di avvio rapido
      - echo '#!/bin/sh' > /app/bin/start-audio-curator
      - echo 'python3 /app/bin/app_desktop.py' >> /app/bin/start-audio-curator
      - chmod +x /app/bin/start-audio-curator
    sources:
      - type: dir
        path: .
